name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned to commit SHAs (security-architecture.md).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache mongod binary (mongodb-memory-server)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Dependency audit (SEC-010)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit, component and integration tests with coverage gates (real MongoDB replica set)
        run: npm run test:coverage
      - run: npm run build
      - name: Docs check
        run: npm run docs:check
      - name: Design token contrast check
        run: npm run design:contrast
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # The supported Docker setup (docker-compose.yml): API integration tests and the E2E suite
  # against the Compose MongoDB replica set instead of mongodb-memory-server (NFR-007).
  docker-mongodb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start MongoDB (docker compose, waits for the replica-set healthcheck)
        run: docker compose up -d --wait mongo
      - name: Migrations against the Compose database
        # A throwaway secret generated per run (never stored); the config requires one.
        run: SESSION_SECRET="$(openssl rand -base64 32)" npm run db:migrate
        env:
          MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
          MONGODB_DB: soloops_ci
          APP_ORIGIN: http://localhost:3000
      - name: API integration tests on the Compose database
        run: npm test -w @soloops/api
        env:
          MONGODB_URI_TEST: mongodb://localhost:27017/?replicaSet=rs0
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests on the Compose database
        run: npm run test:e2e
        env:
          E2E_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      - name: MongoDB logs on failure
        if: failure()
        run: docker compose logs mongo
