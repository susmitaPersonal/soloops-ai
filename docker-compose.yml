# Local development database: MongoDB single-node replica set (transactions need a replica set, ADR-0012).
# Start: docker compose up -d mongo   ·   Reset: docker compose down -v
# Not for production: no auth, bound to localhost only.
services:
  mongo:
    image: mongo:8.2.12
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initialises the replica set on first start, then reports healthy once a primary exists.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

volumes:
  mongo-data:
